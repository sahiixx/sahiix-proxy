name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e
      - name: shellcheck termux scripts
        run: bash -n termux/install.sh && bash -n termux/sync-daemon.sh && bash -n termux/e2e.sh
